  The page that example.css styles. Open both side by side:
      npm run open 10

<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Campus Store — CSS example</title>
    <link rel="stylesheet" href="example.css" />
  </head>
  <body>
    <div class="page">
      <header>
        <h1>Campus Store</h1>
        <nav>
          <a href="#items">Items</a>
          <a href="#about">About</a>
        </nav>
      </header>

      <main>
        <h2 id="items">Items</h2>

        <div class="card-list">
          <article class="card">
            <h3>Notebook</h3>
            <p>Ruled, 120 pages.</p>
            <p class="price">45 EGP</p>
          </article>

          <article class="card">
            <h3>Backpack</h3>
            <p>Two compartments.</p>
            <p class="price">320 EGP</p>
          </article>

          <article class="card">
            <h3>Pen</h3>
            <p>Blue ink.</p>
            <p class="price">15 EGP</p>
          </article>
        </div>

        <h2 id="about">About</h2>
        <p>An example page for module 10.</p>
      </main>

      <footer>
        <p>BINF 503 — Electronic Business Development</p>
      </footer>
    </div>
  </body>
</html>
