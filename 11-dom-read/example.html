<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reading the page — example</title>
    <link rel="stylesheet" href="page.css" />
  </head>
  <body>
    <h1>Campus Store</h1>
    <p>Everything below was read out of this page by example.js.</p>

    <ul class="card-list">
      <li class="card">
        <h3>Notebook</h3>
        <p class="price">45 EGP</p>
      </li>
      <li class="card sold-out">
        <h3>Backpack</h3>
        <p class="price">320 EGP</p>
      </li>
      <li class="card">
        <h3>Pen</h3>
        <p class="price">15 EGP</p>
      </li>
    </ul>

    <div id="output">(example.js writes here)</div>

    <script src="example.js"></script>
  </body>
</html>
