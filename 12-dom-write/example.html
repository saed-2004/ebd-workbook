<!-- The page example.js builds. Open it with:  npm run open 12 -->
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Changing the page — example</title>
    <link rel="stylesheet" href="page.css" />
  </head>
  <body>
    <h1>Campus Store</h1>
    <p>The list below started empty. example.js filled it in.</p>

    <div class="controls">
      <button id="add">Add one more</button>
      <button id="clear" class="secondary">Clear the list</button>
    </div>

    <ul class="card-list" id="list"></ul>

    <div id="output">Clicks so far: 0</div>

    <script src="example.js"></script>
  </body>
</html>
